name: Unit tests
on:
  push:
    branches: [main, develop, test-github-actions]
  pull_request:
    branches: [main, develop, test-github-actions]
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-26.04-arm, macos-26]
        compiler: [gcc, clang]
        # On Windows, use MSVC and clang-cl instead.
        include:
          - os: windows-2025
            compiler: msvc
          - os: windows-2025
            compiler: clang-cl
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true
      - run: bazel test --keep_going --config=${{ matrix.compiler }} //...
